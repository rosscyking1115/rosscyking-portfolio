name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Rewritten at cutover, in the same commit that removed Next — a workflow still
# running `next build` would fail on the cutover PR itself.
#
# The NEXT_PUBLIC_SITE_URL env on every job is gone. Astro reads PUBLIC_SITE_URL
# through `astro:env`, and it is declared optional, so CI does not need to set
# it: `site` in astro.config.mjs is what canonical URLs and the sitemap are
# built from, and that is committed.

jobs:
  quality:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run validate:projects
      - run: npm run format:check
      - run: npm run lint
      # `astro check` rather than `tsc --noEmit`: it type-checks the .astro
      # frontmatter and templates too, which tsc cannot see.
      - run: npm run typecheck
      - run: npm run build

  unit:
    name: Vitest (unit + component)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:coverage
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  e2e:
    name: Playwright (E2E + a11y)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      # `test:e2e` runs `astro build && playwright test`, so the build is not
      # repeated as a separate step here.
      - run: npm run test:e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
