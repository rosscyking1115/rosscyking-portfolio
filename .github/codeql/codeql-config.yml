name: "rosscyking-portfolio"

# ── WHY THIS FILE EXISTS ──────────────────────────────────────────────────────
# CodeQL raised a TRUE finding against code this repository may not change and
# never ships:
#
#   docs/design-bundle/support.js:1407
#   "Missing origin verification in postMessage handler"
#
# That file is the runtime for the vendored design mocks. It is third-party, it
# is marked "do not port" by the design spec and by docs/design-bundle's own
# README, and it is not in the build: `docs/` is not an Astro source directory,
# nothing imports it, and it never reaches .vercel/output. A `postMessage`
# handler with no origin check is a real weakness in a page that loads it — and
# the only page that loads it is the mock, opened from the filesystem by
# whoever is reading the design.
#
# So the alert is correct and the answer is not to fix it. Two ways to make it
# go away, and only one of them is honest:
#
#   RESOLVE THE THREAD.  Clicks away this instance and leaves the next vendored
#                        bundle to raise it again — the finding returns every
#                        time the design is re-exported, and each time someone
#                        has to re-derive that it does not matter.
#   SCOPE THE SCAN.      Says once, in the repository, that vendored artefacts
#                        under docs/ are not this project's code. Which is
#                        already what .prettierignore and eslint.config.mjs say.
#
# This is the second. The three ignore lists now agree with each other, which
# is the actual invariant: docs/design-bundle is read, not maintained.
#
# NOTHING ELSE IS EXCLUDED. src/, scripts/ and tests/ are all still analysed —
# narrowing a security scan to make a merge go through is how a scan stops
# meaning anything, and the exclusion here is one directory of other people's
# HTML with a documented reason.
paths-ignore:
  - docs/
